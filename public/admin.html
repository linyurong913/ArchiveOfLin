<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>馆藏管理 · 林办档案馆</title><link rel="stylesheet" href="style.css"><link rel="icon" href="favicon.svg"><script src="admin.js" defer></script></head><body>
<header class="topbar"><a class="brand" href="/"><span class="seal" aria-hidden="true"><img src="linbiao-white.svg" alt="" width="365" height="794"></span><span class="brand-wordmark"><strong>林办档案馆</strong><small aria-label="ARCHIVE OF LIN BIAO"><span>ARCHIVE</span> <span>OF</span> <span>LIN</span> <span>BIAO</span></small></span></a><nav><a href="/">返回文献目录</a><span>管理员 · 本机</span><button id="logout">退出登录</button></nav></header>
<main class="admin-main"><div class="admin-toolbar"><h1>馆藏管理</h1><button class="primary" id="new-item">新增书目</button><button class="secondary" id="backup">导出书目备份</button></div><div class="notice">文件上传后保存在这台电脑。Proton 双向同步尚未连接；共享链接密码不在此处保存。发布后，本机读者目录可显示该条目及文件。</div><div class="admin-layout"><aside class="admin-list"><input id="admin-search" placeholder="搜索书目…" aria-label="搜索管理书目"><div id="admin-items"></div></aside><section class="admin-editor"><div id="editor-heading" class="eyebrow">新增书目</div><form id="item-form"><div class="form-grid"><label class="field full">标题<input name="title" required maxlength="500"></label><label class="field">作者<input name="author"></label><label class="field">年代<input name="year" placeholder="未知可留空"></label><label class="field">分类<select name="category_id" id="edit-category"></select></label><label class="field">发布状态<select name="status"><option value="draft">草稿</option><option value="published">已发布</option><option value="archived">已归档（不公开）</option></select></label><label class="field full">原始文件名<input name="original_name"></label><label class="field">文件格式<select name="format"><option value="">待录入</option><option>PDF</option><option>EPUB</option><option>TXT</option><option>ZIP</option><option>DOCX</option><option>其他</option></select></label><label class="field">文件大小<input name="size_label" placeholder="例如 5.10 MB"></label><label class="field full">来源路径<input name="source_path" placeholder="林办档案馆 / 分类 / 文件名"></label><label class="field full">Proton 分享链接<input name="proton_url" type="url" placeholder="https://drive.proton.me/…"></label><label class="field full">链接定位范围<select name="link_scope"><option value="folder">文件夹入口（需要按路径定位）</option><option value="file">已核实的单文件分享链接</option></select></label><label class="field full">书目说明<textarea name="description" placeholder="版本、出处、完整性、待核信息…"></textarea></label></div><div class="form-actions"><button class="primary" id="save" type="submit">保存书目</button><span id="save-status" role="status"></span></div></form><section class="upload-section"><h2>上传文件版本</h2><p>先保存书目，再选择文件。支持 PDF、TXT、EPUB、ZIP、DOCX，单个文件最多 512 MB；同一书目的重复文件不会再次保存。</p><input id="upload-file" type="file" accept=".pdf,.txt,.epub,.zip,.docx" aria-label="选择文件版本"><button class="secondary" id="upload">保存到本机</button><p id="upload-status" role="status"></p><div id="file-list"></div></section><section class="upload-section"><h2>书目修订记录</h2><div id="history">保存后显示修订记录。</div></section></section></div></main><div id="toast" role="status" class="toast" hidden></div></body></html>
