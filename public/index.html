<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="description" content="林办档案馆：林彪及相关历史资料的分类书目、版本记录与原文访问目录。"><title>林办档案馆 · 文献目录</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><a class="skip" href="#main">跳转到文献目录</a>
<header class="topbar"><a class="brand" href="./"><span class="seal">林<br>档</span><span><strong>林办档案馆</strong><small>LINBAN ARCHIVE</small></span></a><nav aria-label="主导航"><a class="active" href="./">文献目录</a><button id="about">馆藏说明</button><a id="source-top" target="_blank" rel="noopener noreferrer">Proton 原文库 <span aria-hidden="true">↗</span></a><a id="admin-link" href="/admin" hidden>管理</a></nav></header>
<div class="layout"><aside class="sidebar"><div class="sidebar-heading">馆藏分类 <span id="category-count"></span></div><button id="all-category" class="category active">全部文献 <span id="all-count">—</span></button><div id="categories"></div><div class="side-note"><span class="eyebrow">编目原则</span><p>保留原始文件名与来源路径，书目信息以原件核对为准。</p><button class="text-button" id="coverage-info">查看编目范围</button></div></aside>
<main id="main"><div class="page-heading"><div><div class="eyebrow">COLLECTION / 文献检索</div><h1 id="heading">全部文献</h1><p id="intro">在文献之间寻找线索。</p></div><div class="collection-mark" aria-hidden="true">文<br>献</div></div>
<section class="search-panel" aria-label="检索条件"><div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索书名、作者、原始文件名或目录…" aria-label="搜索文献"><kbd aria-hidden="true">/</kbd></div><div class="filter-line"><div class="formats" id="formats" aria-label="文件格式"><button class="chip active" data-format="">全部格式</button><button class="chip" data-format="PDF">PDF</button><button class="chip" data-format="EPUB">EPUB</button><button class="chip" data-format="TXT">TXT</button><button class="chip" data-format="ZIP">ZIP</button></div><label class="sort-label">排序 <select id="sort"><option value="id">目录顺序</option><option value="title">书名排序</option><option value="updated">最近编目</option></select></label></div></section>
<div class="result-bar"><div role="tablist" aria-label="浏览方式"><button class="tab active" id="items-tab" role="tab" aria-selected="true">文献条目</button><button class="tab" id="folders-tab" role="tab" aria-selected="false">原始目录</button></div><button id="export" class="text-button">导出当前书目</button></div>
<div id="result-summary" class="result-summary" role="status" aria-live="polite">正在加载书目…</div><section id="results" aria-label="文献结果"></section>
<footer><span>林办档案馆 · 目录初版</span><span id="snapshot-date"></span><span>原文访问由 Proton Drive 提供</span></footer>
</main></div>
<dialog id="detail"><div class="dialog-head"><span class="eyebrow" id="detail-id"></span><button class="icon-button" id="close-detail" aria-label="关闭详情">×</button></div><div id="detail-content"></div></dialog>
<dialog id="info"><div class="dialog-head"><span class="eyebrow">馆藏说明</span><button class="icon-button" id="close-info" aria-label="关闭说明">×</button></div><h2>一份可以继续生长的目录</h2><div id="info-content"></div></dialog><div id="toast" role="status" class="toast" hidden></div>
</body></html>
